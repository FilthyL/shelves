name: Probe covers
on:
  push:
    branches: [ccr-9ed8a046-dq7s74]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          t() { curl -sS -L -m 40 -A "$UA" -H "Origin: https://filthyl.github.io" -o /tmp/o -w "ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download} redirects=%{num_redirects} final=%{url_effective}\n" "$1" | cut -c1-230; }
          IDS="8746964 1020563 9929208 4933343 12856568"
          echo "== direct L (cold)"; for i in $IDS; do t "https://covers.openlibrary.org/b/id/$i-L.jpg?default=false"; done
          echo "== direct L (again)"; for i in $IDS; do t "https://covers.openlibrary.org/b/id/$i-L.jpg?default=false"; done
          echo "== direct M"; for i in $IDS; do t "https://covers.openlibrary.org/b/id/$i-M.jpg?default=false"; done
          echo "== direct S"; for i in $IDS; do t "https://covers.openlibrary.org/b/id/$i-S.jpg?default=false"; done
          echo "== wsrv w=300 webp (cold, then warm)"; for i in $IDS; do t "https://wsrv.nl/?url=https://covers.openlibrary.org/b/id/$i-L.jpg&w=300&output=webp&q=80"; done
          for i in $IDS; do t "https://wsrv.nl/?url=https://covers.openlibrary.org/b/id/$i-L.jpg&w=300&output=webp&q=80"; done
          echo "== headers: OL L"; curl -sS -I -m 30 -A "$UA" -H "Origin: https://filthyl.github.io" "https://covers.openlibrary.org/b/id/8746964-L.jpg?default=false" | head -25
          echo "== headers: following redirect"; curl -sS -L -I -m 30 -A "$UA" -H "Origin: https://filthyl.github.io" "https://covers.openlibrary.org/b/id/1020563-L.jpg?default=false" | grep -i -E "^HTTP|location|cache-control|access-control|etag|last-modified|expires|content-length|age:|server" | head -30
          echo "== headers: wsrv"; curl -sS -I -m 30 -A "$UA" -H "Origin: https://filthyl.github.io" "https://wsrv.nl/?url=https://covers.openlibrary.org/b/id/1020563-L.jpg&w=300&output=webp&q=80" | head -25
          echo "== headers: anilist"; curl -sS -I -m 30 -A "$UA" -H "Origin: https://filthyl.github.io" "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx47-4CR68arv452h.jpg" | head -20
