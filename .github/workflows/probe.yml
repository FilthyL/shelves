name: Probe covers
on:
  push:
    branches: [ccr-9ed8a046-dq7s74]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'shelves/1.0 (cover probe)'}), timeout=25).read()
              except Exception as e:
                  return str(e).encode()
          for q in ({'title': 'vagabond', 'author': 'Takehiko Inoue'}, {'title': 'バガボンド'}, {'q': 'vagabond vol 3 inoue'}, {'title': 'vinland saga', 'author': 'Makoto Yukimura'}, {'title': 'ヴィンランド・サガ'}, {'q': 'vinland saga vol 3 yukimura'}, {'title': 'dorohedoro', 'author': 'Q Hayashida'}, {'q': 'dorohedoro vol 1'}):
              b = get('https://openlibrary.org/search.json?' + urllib.parse.urlencode({**q, 'limit': 30, 'fields': 'title,author_name,cover_i,isbn'}))
              print('==', q, len(b))
              try:
                  for d in json.loads(b)['docs'][:30]:
                      print('  ', (d.get('title') or '')[:60], '|', ','.join(d.get('author_name') or [])[:40], '| cover', d.get('cover_i'), '| isbns', len(d.get('isbn') or []))
              except Exception as e:
                  print('  parse', e, b[:150])
              time.sleep(1.1)
          PY
