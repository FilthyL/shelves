name: Probe covers
on:
  push:
    branches: [ccr-9ed8a046-dq7s74]
    paths: [".github/workflows/probe.yml", "tools/covers.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Look the manga covers up
        env:
          PYTHONUNBUFFERED: "1"
        run: python tools/covers.py --room manga
      - name: Summarise
        run: |
          python - <<'PY'
          import json, sys, urllib.parse, collections
          sys.path.insert(0, 'tools')
          from shelflib import slug, parse_owned
          c = json.load(open('data/covers.json'))
          items = json.load(open('data/rooms/manga.json'))['items']
          tot = got = 0
          for it in items:
              sid = slug(it['title']); e = c.get('manga/' + sid) or {}
              vols = parse_owned(it['owned'], it.get('total')); vc = e.get('vols', {})
              hosts = collections.Counter(urllib.parse.urlparse(x['src']).netloc for x in vc.values())
              tot += len(vols); got += len(vc)
              print(f"{sid:22} owned {len(vols):3} own-cover {len(vc):3}  series={urllib.parse.urlparse(e.get('src','')).netloc or 'NONE'}  {dict(hosts)}")
          print('TOTAL', got, 'of', tot)
          PY
