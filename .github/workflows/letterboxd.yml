name: Sync films from Letterboxd

# Brings new films, ratings and reviews from the Letterboxd profile in
# data/house.json onto the Screening Room shelf, then redeploys the site
# (which also finds covers for any new films).

on:
  schedule:
    - cron: "41 4 * * *" # daily
  workflow_dispatch:
    inputs:
      user:
        description: "Letterboxd username (blank uses data/house.json)"
        required: false
        default: ""
      replace:
        description: "Make the films shelf exactly your Letterboxd films"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: letterboxd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Letterboxd
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/letterboxd.py \
            ${{ inputs.user && format('--user {0}', inputs.user) || '' }} \
            ${{ inputs.replace && '--replace' || '' }}
          python tools/validate.py
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "shelves-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rooms
          if git diff --cached --quiet; then
            echo "Nothing new on Letterboxd"
          else
            git commit -m "Sync films from Letterboxd"
            for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
            gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          fi
